services:
  db:
    image: postgres:15-alpine
    container_name: nexai-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nexai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: nexai-web
    restart: always
    ports:
      - "3000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-nexai}
      PORT: 5000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # First push schema changes then start the server
    command: /bin/sh -c "npm run db:push && npm start"

  agent:
    build: .
    container_name: nexai-agent
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-nexai}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Run the LiveKit agent worker
    command: npx tsx server/agent.ts start

volumes:
  postgres_data:
