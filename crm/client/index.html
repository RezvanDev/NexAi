<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexAI CRM | Voice Assistants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/crm/favicon.png" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --secondary: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Sidebar/Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            color: var(--primary);
            -webkit-text-fill-color: initial;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: var(--border);
            border-color: var(--text-muted);
        }

        /* Grid */
        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.9);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .company-icon {
            width: 56px;
            height: 56px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-value {
            font-weight: 700;
            font-size: 18px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Detail View */
        #detail-view {
            display: none;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s;
            width: fit-content;
        }

        .nav-back:hover {
            color: white;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 32px;
        }

        .section-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* History Table */
        .call-item {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            cursor: pointer;
            border-radius: 12px;
        }

        .call-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .call-lead {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .call-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .badge-warning { background: rgba(234, 179, 8, 0.15); color: #facc15; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 32px;
            position: relative;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--primary);
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 600;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: translateY(200%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        #toast.show { transform: translateY(0); }

        .empty-state {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }

        .empty-state i {
            display: block;
            margin: 0 auto 24px;
            opacity: 0.3;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }
        .tab-btn.active {
            color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login View -->
        <div id="login-view" style="display: none; max-width: 400px; margin: 80px auto;">
            <div class="card" style="padding: 40px;">
                <div class="logo" style="justify-content: center; margin-bottom: 32px;">
                    <i data-lucide="mic"></i> NexAI CRM
                </div>
                <h2 style="text-align: center; margin-bottom: 24px; font-size: 20px;">Вход в систему</h2>
                
                <div class="input-group">
                    <label class="label">Логин</label>
                    <input type="text" id="username" placeholder="Ваш логин">
                </div>
                <div class="input-group">
                    <label class="label">Пароль</label>
                    <input type="password" id="password" placeholder="Ваш пароль">
                </div>
                
                <button class="btn" style="width: 100%; justify-content: center; margin-top: 32px;" onclick="login()">
                    Войти
                </button>
                <div id="loginError" style="color: #ef4444; text-align: center; margin-top: 16px; font-size: 14px; display: none;"></div>
            </div>
        </div>

        <!-- Main Dashboard View -->
        <div id="main-view" style="display: none;">
            <header>
                <div class="logo">
                    <i data-lucide="mic"></i>
                    NexAI CRM
                </div>
                <div style="display: flex; gap: 16px; align-items: center;">
                    <span id="user-info" style="color: var(--text-muted); font-size: 14px;"></span>
                    <button id="addCompanyBtn" class="btn" onclick="openModal()">
                        <i data-lucide="plus"></i>
                        Добавить клиента
                    </button>
                    <button class="btn btn-outline" onclick="logout()">
                        <i data-lucide="log-out"></i>
                        Выйти
                    </button>
                </div>
            </header>

            <div class="company-grid" id="companyGrid">
                <!-- Loading State or Empty -->
                <div class="empty-state">
                    <i data-lucide="loader-2" class="animate-spin" style="width: 48px; height: 48px;"></i>
                    <p>Загрузка данных...</p>
                </div>
            </div>
        </div>

        <!-- Detail View -->
        <div id="detail-view" style="display: none;">
            <div class="nav-back" id="navBackBtn" onclick="showDashboard()">
                <i data-lucide="arrow-left"></i>
                Назад к списку клиентов
            </div>

            <div id="detailContent">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Create Company Modal -->
    <div id="companyModal" class="modal">
        <div class="modal-content">
            <h2 class="section-title">Новый клиент</h2>
            <div class="input-group">
                <label class="label">Название компании</label>
                <input type="text" id="newCompanyName" placeholder="Напр. Пиццерия Марио">
            </div>
            <div class="input-group">
                <label class="label">Имя ИИ-ассистента</label>
                <input type="text" id="newAgentName" placeholder="Напр. Иван">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
                <div class="input-group">
                    <label class="label">Логин для входа</label>
                    <input type="text" id="newUsername" placeholder="login123">
                </div>
                <div class="input-group">
                    <label class="label">Пароль</label>
                    <input type="password" id="newPassword" placeholder="******">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
                <div class="input-group">
                    <label class="label">Пакет минут (Лимит в месяц)</label>
                    <input type="number" id="newLimitMinutes" value="100" placeholder="100">
                </div>
                <div class="input-group">
                    <label class="label">Голос</label>
                    <select id="newVoice" style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
                        <option value="alloy">Alloy (Нейтральный)</option>
                        <option value="echo">Echo (Мужской, теплый)</option>
                        <option value="shimmer">Shimmer (Женский, четкий)</option>
                        <option value="ash">Ash (Мужской, низкий)</option>
                        <option value="coral">Coral (Женский, мягкий)</option>
                        <option value="sage">Sage (Женский, спокойный)</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 32px;">
                <button class="btn" style="flex: 1" onclick="createCompany()">Создать</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Transcript Modal -->
    <div id="transcriptModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <h2 class="section-title">Детали разговора</h2>
            <div id="transcriptText" style="height: 400px; overflow-y: auto; background: rgba(15,23,42,0.5); padding: 24px; border-radius: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;">
                <!-- Transcript content -->
            </div>
            <button class="btn" style="margin-top: 32px; width: 100%" onclick="closeTranscript()">Закрыть</button>
        </div>
    </div>

    <div id="toast">Настройки соханены!</div>

    <script>
        let currentCompanyId = null;
        let currentUser = null;

        async function init() {
            lucide.createIcons();
            await checkAuth();
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/user');
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('user-info').textContent = currentUser.username;
                    
                    if (currentUser.companyId) {
                        // Client Owner - go directly to their company detail
                        document.getElementById('addCompanyBtn').style.display = 'none';
                        document.getElementById('main-view').style.display = 'none';
                        showCompanyDetail(currentUser.companyId);
                    } else {
                        // Super Admin
                        document.getElementById('main-view').style.display = 'block';
                        await fetchCompanies();
                    }
                } else {
                    // Show login
                    document.getElementById('login-view').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('login-view').style.display = 'block';
            }
        }

        async function login() {
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                if (res.ok) {
                    errorDiv.style.display = 'none';
                    document.getElementById('login-view').style.display = 'none';
                    await checkAuth();
                } else {
                    const data = await res.json();
                    errorDiv.textContent = data.message || "Неверный логин или пароль";
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = "Ошибка соединения";
                errorDiv.style.display = 'block';
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        async function fetchCompanies() {
            const res = await fetch('/api/companies');
            const companies = await res.json();
            renderCompanies(companies);
        }

        function renderCompanies(companies) {
            const grid = document.getElementById('companyGrid');
            if (companies.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1"><i data-lucide="users" style="width: 64px; height: 64px"></i><p>У вас пока нет клиентов. Создайте первого!</p></div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = companies.map(c => `
                <div class="card" onclick="showCompanyDetail(${c.id})">
                    <div class="card-header">
                        <div class="company-icon">
                            <i data-lucide="building-2"></i>
                        </div>
                        <button class="btn btn-outline" style="padding: 8px" onclick="event.stopPropagation(); deleteCompany(${c.id})">
                            <i data-lucide="trash-2" style="width: 16px; height: 16px; color: #ef4444"></i>
                        </button>
                    </div>
                    <div>
                        <h3 class="card-title">${c.name}</h3>
                        <p class="card-subtitle">${c.agentName || 'Имя не задано'} — ${c.agentRole || 'Менеджер'}</p>
                    </div>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-value">${c.stats?.totalCalls || 0}</span>
                            <span class="stat-label">Звонков</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${Math.ceil((c.stats?.totalDuration || 0) / 60)}</span>
                            <span class="stat-label">Минут</span>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function showCompanyDetail(id) {
            currentCompanyId = id;
            const res = await fetch(`/api/companies/${id}`);
            const c = await res.json();

            const callsRes = await fetch(`/api/companies/${id}/calls`);
            const calls = await callsRes.json();

            document.getElementById('main-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';

            if (currentUser && currentUser.companyId) {
                document.getElementById('navBackBtn').style.display = 'none';
            } else {
                document.getElementById('navBackBtn').style.display = 'flex';
            }

            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('analytics')"><i data-lucide="bar-chart-2"></i> Аналитика</button>
                    <button class="tab-btn" onclick="switchTab('settings')"><i data-lucide="settings"></i> Настройки агента</button>
                    <button class="tab-btn" onclick="switchTab('calls')"><i data-lucide="history"></i> История звонков</button>
                </div>

                <div id="tab-analytics" class="tab-content active">
                    <div class="section-card">
                        <h2 class="section-title">Аналитика</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;">
                            <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center;">
                                <div style="font-size: 48px; font-weight: 700; color: var(--primary); font-family: var(--font-display);">${c.stats?.totalCalls || 0}</div>
                                <div style="color: var(--text-muted); margin-top: 8px;">Всего разговоров</div>
                            </div>
                            <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; position: relative; overflow: hidden;">
                                <div style="position: absolute; bottom: 0; left: 0; height: 4px; background: var(--accent); width: ${Math.min(100, (Math.ceil((c.stats?.totalDuration || 0) / 60) / (c.limitMinutes || 100)) * 100)}%;"></div>
                                <div style="font-size: 48px; font-weight: 700; color: var(--accent); font-family: var(--font-display);">
                                    ${Math.ceil((c.stats?.totalDuration || 0) / 60)} <span style="font-size: 20px; color: var(--text-muted)">/ ${c.limitMinutes || 100}</span>
                                </div>
                                <div style="color: var(--text-muted); margin-top: 8px;">Потрачено минут ИИ</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-settings" class="tab-content">
                    <div class="detail-layout">
                        <div class="section-card">
                            <h2 class="section-title">Настройки агента</h2>
                            
                            <div class="input-group">
                                <label class="label">Название компании</label>
                                <input type="text" id="editName" value="${c.name || ''}">
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="input-group">
                                    <label class="label">Имя ассистента</label>
                                    <input type="text" id="editAgentName" value="${c.agentName || ''}">
                                </div>
                                <div class="input-group">
                                    <label class="label">Роль</label>
                                    <input type="text" id="editAgentRole" value="${c.agentRole || ''}">
                                </div>
                            </div>

                            <div class="input-group">
                                <label class="label">Голос</label>
                                <select id="editVoice" style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
                                    <option value="alloy" ${c.voice === 'alloy' ? 'selected' : ''}>Alloy (Нейтральный)</option>
                                    <option value="echo" ${c.voice === 'echo' ? 'selected' : ''}>Echo (Мужской, теплый)</option>
                                    <option value="shimmer" ${c.voice === 'shimmer' ? 'selected' : ''}>Shimmer (Женский, четкий)</option>
                                    <option value="ash" ${c.voice === 'ash' ? 'selected' : ''}>Ash (Мужской, низкий)</option>
                                    <option value="coral" ${c.voice === 'coral' ? 'selected' : ''}>Coral (Женский, мягкий)</option>
                                    <option value="sage" ${c.voice === 'sage' ? 'selected' : ''}>Sage (Женский, спокойный)</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label class="label">Приветствие</label>
                                <textarea id="editGreeting">${c.agentGreeting || ''}</textarea>
                            </div>

                            <div class="input-group">
                                <label class="label">Системные инструкции (Промпт)</label>
                                <textarea id="editPrompt" style="min-height: 250px">${c.systemPrompt || ''}</textarea>
                            </div>
                            
                            <div class="input-group" style="${(!currentUser || !currentUser.companyId) ? '' : 'display: none'}">
                                <label class="label">Пакет минут (Лимит в месяц)</label>
                                <input type="number" id="editLimitMinutes" value="${c.limitMinutes || 100}">
                            </div>
                            
                            <div class="input-group">
                                <label class="label">
                                    <i data-lucide="send" style="display: inline-block; width: 14px; height: 14px; margin-right: 4px; vertical-align: middle;"></i>
                                    Telegram Chat ID для уведомлений
                                </label>
                                <input type="text" id="editTelegramChatId" value="${c.telegramChatId || ''}" placeholder="Напр. 123456789">
                                <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
                                    Добавьте нашего бота <strong>@NexAI_Notify_Bot</strong> (или своего) и отправьте ему <code>/start</code>, чтобы получить свой Chat ID.
                                </p>
                            </div>

                            <button class="btn" style="width: 100%; justify-content: center;" onclick="saveCompany()">
                                <i data-lucide="save"></i> Сохранить изменения
                            </button>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 32px;">
                            <div class="section-card" style="padding: 32px">
                                <h3 class="section-title" style="font-size: 18px; margin-bottom: 24px;"><i data-lucide="share-2"></i> Ссылка для звонка</h3>
                                <button class="btn btn-outline" style="width: 100%" onclick="copyLink()">
                                    <i data-lucide="copy"></i> Копировать ссылку
                                </button>
                                <p style="font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.5;">
                                    Отправьте эту ссылку клиенту, чтобы он мог начать разговор с агентом.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-calls" class="tab-content">
                    <div class="section-card">
                        <h3 class="section-title"><i data-lucide="history"></i> Последние звонки</h3>
                        <div id="callsList">
                            ${calls.length === 0 ? '<p style="color: var(--text-muted); font-size: 14px;">Звонков пока не было</p>' : 
                                calls.map(call => `
                                    <div class="call-item" onclick="viewTranscript('${call.transcript?.replace(/'/g, "\\'").replace(/\n/g, "\\n") || 'Транскрипт пуст'}')">
                                        <div>
                                            <div class="call-lead">${call.leadName}</div>
                                            <div class="call-meta">
                                                <span>${new Date(call.startedAt).toLocaleDateString()}</span>
                                                <span>${call.duration || 0} сек</span>
                                            </div>
                                        </div>
                                        <div class="badge ${call.duration > 0 ? 'badge-success' : 'badge-warning'}">
                                            ${call.duration > 0 ? 'Отвечен' : 'Пропущен'}
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            lucide.createIcons();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function showDashboard() {
            if (currentUser && currentUser.companyId) {
                // If it's a regular user, they shouldn't go back to dashboard
                return;
            }
            document.getElementById('main-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
            fetchCompanies();
        }

        async function saveCompany() {
            const data = {
                name: document.getElementById('editName').value,
                agentName: document.getElementById('editAgentName').value,
                agentRole: document.getElementById('editAgentRole').value,
                agentGreeting: document.getElementById('editGreeting').value,
                systemPrompt: document.getElementById('editPrompt').value,
                telegramChatId: document.getElementById('editTelegramChatId').value,
                limitMinutes: document.getElementById('editLimitMinutes')?.value,
                voice: document.getElementById('editVoice').value
            };

            await fetch(`/api/companies/${currentCompanyId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            showToast("Изменения сохранены!");
        }

        async function createCompany() {
            const name = document.getElementById('newCompanyName').value;
            const agentName = document.getElementById('newAgentName').value;
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            const limitMinutes = document.getElementById('newLimitMinutes').value;
            const voice = document.getElementById('newVoice').value;

            if (!name) return alert("Введите название компании");
            if (!username || !password) return alert("Введите логин и пароль для клиента");

            try {
                const res = await fetch('/api/companies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, agentName, username, password, limitMinutes, voice })
                });

                if (!res.ok) {
                    const data = await res.json();
                    return alert(data.error || "Ошибка при создании");
                }

                closeModal();
                fetchCompanies();
                
                // Clear fields
                document.getElementById('newCompanyName').value = '';
                document.getElementById('newAgentName').value = '';
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
            } catch (e) {
                alert("Сетевая ошибка");
            }
        }

        async function deleteCompany(id) {
            if (!confirm("Удалить этого клиента? Все данные будут стерты.")) return;
            await fetch(`/api/companies/${id}`, { method: 'DELETE' });
            fetchCompanies();
        }

        function copyLink() {
            const url = window.location.origin + "/?companyId=" + currentCompanyId;
            navigator.clipboard.writeText(url);
            showToast("Ссылка скопирована в буфер обмена!");
        }

        function viewTranscript(text) {
            document.getElementById('transcriptText').textContent = text;
            document.getElementById('transcriptModal').style.display = 'flex';
        }

        function closeTranscript() {
            document.getElementById('transcriptModal').style.display = 'none';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function openModal() { document.getElementById('companyModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('companyModal').style.display = 'none'; }

        init();
    </script>
</body>

</html>
